apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloapp-deployment
spec:
  replicas: 2     # Number of app pods to run
  selector:
    matchLabels:
      app: helloapp
  template:
    metadata:
      labels:
        app: helloapp  # Pods will get this label for selector matching
    spec:
      containers:
        - name: helloapp
          image: heisenberg1420/devops:ba5d575e230fe2ecce64d4b293adb58aaa4840f1
          ports:
            - containerPort: 8080
      imagePullSecrets:
        - name: regcred
